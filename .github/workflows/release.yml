name: Release

"on":
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-linux-x86:
    name: Linux x86_64 (musl)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --profile release --target x86_64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ikewolf-linux-x86_64
          path: target/x86_64-unknown-linux-musl/release/ikewolf

  build-linux-arm:
    name: Linux ARM64 (musl)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add aarch64-unknown-linux-musl
          sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --profile release --target aarch64-unknown-linux-musl

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ikewolf-linux-arm64
          path: target/aarch64-unknown-linux-musl/release/ikewolf

  build-macos:
    name: macOS (${{ matrix.target }})
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --profile release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ikewolf-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/ikewolf

  build-windows:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: Build
        run: cargo build --profile release --target x86_64-pc-windows-msvc

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ikewolf-windows-x86_64
          path: target/x86_64-pc-windows-msvc/release/ikewolf.exe

  publish:
    name: Create Release
    needs: [build-linux-x86, build-linux-arm, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: artifacts/

      - name: Prepare release files
        run: |
          set -euo pipefail
          mkdir -p dist
          cp artifacts/ikewolf-linux-x86_64/ikewolf dist/ikewolf-linux-x86_64
          cp artifacts/ikewolf-linux-arm64/ikewolf dist/ikewolf-linux-arm64
          cp artifacts/ikewolf-aarch64-apple-darwin/ikewolf dist/ikewolf-macos-arm64
          cp artifacts/ikewolf-x86_64-apple-darwin/ikewolf dist/ikewolf-macos-x86_64
          cp artifacts/ikewolf-windows-x86_64/ikewolf.exe dist/ikewolf-windows-x86_64.exe
          chmod +x dist/ikewolf-*
          cd dist && sha256sum ./* > SHA256SUMS

      - name: Create GitHub Release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release create "${TAG_NAME}" \
            --draft \
            --title "${TAG_NAME}" \
            --generate-notes \
            dist/./*
